name: Bug report
description: Report incorrect or unexpected behavior in repomap
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do NOT report security vulnerabilities here —
        see SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the command you ran.
      placeholder: "repomap symbol Foo returned ... but I expected ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a small repo/snippet that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: repomap version
      description: Output of `repomap --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: goversion
    attributes:
      label: Go version (if built from source)
      description: Output of `go version`.
